name: IPTV 酒店源

on:
  schedule:
    # 对应北京时间：每天上午 09:23、下午 17:23、次日凌晨 01:23 自动运行一次
    - cron: '23 17,1,9 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 流量压测耗时较长，给予充足的超时时间

    steps:
      - name: 1. 检出私有库代码到当前根目录
        uses: actions/checkout@v4
        with:
          repository: 'linyubo211/tvlive'
          token: ${{ secrets.MY_PRIVATE_REPO_TOKEN }} # 你的私人 GitHub Token
          fetch-depth: 0 # 检出完整历史，方便后面 push

      - name: 2. 环境准备
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: pip install requests urllib3 aiohttp  # 👈 在后面加上 aiohttp

      - name: 4. 执行扫描
        run: python -u py/scan.py

      - name: 5. 执行转换
        run: python -u py/convert.py

      - name: 6. 执行流量测速与清洗
        run: python -u py/clean_hotel.py

      - name: 7. 将生成的结果直接提交并推送回【私有库】
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 将包含新生成的测速报告在内的所有变更加入暂存区
          git add .
          
          if git diff --staged --quiet; then
            echo "✨ 扫描与测速完成，但内容无变动，跳过回传私库。"
          else
            git commit -m "自动更新酒店源及流量测速报告 (由公开Action执行): $(date +'%Y-%m-%d %H:%M:%S')"
            
            # 使用 rebase 防止多人协作冲突，推送到私库的 main 分支
            git pull origin main --rebase
            git push origin main
          fi
