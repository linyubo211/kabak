name: IPTV 酒店源全流程

on:
  schedule:
    - cron: '5 1,9,17 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 给全流程留出足够时间

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: pip install requests urllib3

    - name: 目录初始化
      run: mkdir -p py/iptv_results

    - name: 1. 执行扫描 (scan.py)
      run: python -u py/scan.py

    - name: 2. 执行转换 (convert.py)
      run: python -u py/convert.py

    - name: 3. 执行清洗与测速 (clean_hotel.py)
      run: python -u py/clean_hotel.py

    - name: 提交并推送结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 1. 先把所有修改加入暂存区（这是解决问题的关键）
        git add .

        # 2. 检查是否有文件变动
        if git diff --staged --quiet; then
          echo "✨ 扫描完成，但内容无变动，跳过提交。"
        else
          # 3. 如果有变动，先 commit 到本地
          git commit -m "自动更新酒店源: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 4. 尝试拉取远程更新并合并本地 commit
          # 使用 rebase 保持提交记录整洁
          git pull origin main --rebase
          
          # 5. 推送
          git push origin main
        fi
