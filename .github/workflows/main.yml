name: IPTV 酒店源全流程

on:
  schedule:
    - cron: '40 22 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: pip install requests urllib3

    - name: 目录初始化
      run: mkdir -p py/iptv_results

    # 下面这两步已被安全地跳过，不会引起格式错误
    - name: 1. 执行扫描 (跳过)
      run: echo "Step 1 skipped"

    - name: 2. 执行转换 (跳过)
      run: echo "Step 2 skipped"

    - name: 3. 执行清洗与测速 (clean_hotel.py)
      run: python -u py/clean_hotel.py

    - name: 提交并推送结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add py/
        
        if git diff --staged --quiet; then
          echo "没有变动，跳过。"
        else
          git commit -m "自动更新: $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        fi
