name: IPTV 酒店源全流程

on:
  schedule:
    # 每天北京时间早上 6:40 运行 (22:40 UTC)
    - cron: '0 */4 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 给全流程留出足够时间

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安装依赖
      run: pip install requests urllib3

    - name: 目录初始化
      run: mkdir -p py/iptv_results

    - name: 1. 执行扫描 (scan.py)
      run: python -u py/scan.py

    - name: 2. 执行转换 (convert.py)
      run: python -u py/convert.py

    - name: 3. 执行清洗与测速 (clean_hotel.py)
      run: python -u py/clean_hotel.py

    - name: 提交并推送结果
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 先把远程最新的拉下来，防止推送冲突
        git pull origin main --rebase

        # 暂存所有在 py/ 目录下的修改
        git add py/
        
        if git diff --staged --quiet; then
          echo "✨ 扫描完成，但内容无变动，跳过提交。"
        else
          git commit -m "自动更新酒店源: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 再次确认并推送到远程
          git push origin main
        fi
