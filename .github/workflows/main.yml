name: IPTV 酒店源全流程

on:
  schedule:
    # 建议避开整点，减少 GitHub 服务器拥堵
    - cron: '40 22 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 给清洗任务留出足够的宽裕时间
    timeout-minutes: 60 

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: 环境准备
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # 自动缓存 pip 依赖，加快执行速度
        cache: 'pip'

    - name: 安装依赖
      run: |
        pip install requests urllib3

    - name: 目录初始化
      run: |
        mkdir -p py/iptv_results
        # 确保输入文件存在，防止脚本崩溃
        touch py/all_channels.m3u

    # 如果后续需要更深入检测视频流，可以取消下方注释
    # - name: 安装 FFmpeg
    #   run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: 1. 执行扫描 (目前注释中)
      # run: python -u py/scan.py

    - name: 2. 执行转换 (目前注释中)
      # run: python -u py/convert.py

    - name: 3. 执行清洗与测速 (clean_hotel.py)
      run: python -u py/clean_hotel.py

    - name: 提交并推送结果
      # 使用 continue-on-error 防止因为 git 没有任何改动而导致整个 Action 报错
      continue-on-error: true
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 确保拉取最新远程代码
        git pull origin main
        
        git add py/
        
        # 检查是否有内容变更
        if git diff --staged --quiet; then
          echo "No changes detected, skipping commit."
        else
          git commit -m "自动更新酒店源: $(date +'%Y-%m-%d %H:%M:%S')"
          # 使用 rebase 模式推送，确保提交历史是一条直线
          git pull --rebase origin main
          git push origin main
        fi
