name: 自动更新 FOFA 酒店源

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本
        env:
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
        run: python py/update_fofa.py

      - name: 提交并推送更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查文件是否存在
          if [ -f "py/1000_alive.txt" ]; then
            git add py/1000_alive.txt
            # 如果没有变化，commit 会报错，所以用 || 处理
            git commit -m "自动更新: 追加 FOFA 新数据" || echo "没有变更需要提交"
            git push
          else
            echo "错误: py/1000_alive.txt 未生成，跳过推送。"
          fi
