name: FOFA Web 自动爬取

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点执行一次，避免频繁访问被封号
  workflow_dispatch:    # 支持手动运行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行爬虫脚本
        env:
          FOFA_COOKIE: ${{ secrets.FOFA_COOKIE }}
        run: python py/update_fofa.py

      - name: 提交更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f "py/1000_alive.txt" ]; then
            git add py/1000_alive.txt
            git commit -m "自动更新：追加最新 FOFA 资产" || echo "无变更"
            git push
          fi
